<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop — Chat with Seller</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <h1>My Shop</h1>
  </header>

  <main class="content" role="main">
    <section class="product">
      <h2 id="product-title">Product name</h2>
      <p id="product-desc">Product description …</p>
      <p><small>Product id (SHOP_ID) used by chat: <code id="product-id">shop-123</code></small></p>
    </section>
  </main>

  <!-- Chat widget root -->
  <div id="chat-root" aria-live="polite"></div>

  <noscript>
    <div style="position:fixed; right:12px; bottom:12px; background:#fde68a; padding:8px 12px; border-radius:8px;">
      This site requires JavaScript to use the chat. Please enable JavaScript.
    </div>
  </noscript>

  <script type="module" src="chat.js"></script>
</body>
</html>
