<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Chat Admin</title>
  <link rel="stylesheet" href="./chat.css" />
</head>
<body>
  <header class="site-header"><h1 style="margin:0;padding:12px 16px">Seller Chat Admin</h1></header>

  <main style="padding:16px;">
    <div style="margin-bottom:12px">
      <label>Shop ID:
        <input id="shopId" value="shop-123" />
      </label>
      <button id="loadBtn">Load Chat</button>
      <span id="authArea" style="margin-left:12px"></span>
    </div>

    <div id="messages" style="padding:8px; border:1px solid #eee; border-radius:8px; min-height:200px;"></div>

    <div style="padding:16px; display:flex; gap:8px;">
      <input id="reply" placeholder="Type your reply..." style="flex:1; padding:8px;" />
      <button id="sendBtn" style="padding:8px 12px; background:var(--accent); color:white; border:0; border-radius:6px;">Send</button>
    </div>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
